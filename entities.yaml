# Entity registry -- the ONLY place entity types are defined (build doc section 6.2).
#
# The detector builds Presidio recognizers from this file. The engine, vault,
# restorer, and audit logger treat `entity_type` as an OPAQUE STRING. That is what
# makes "add a new entity type via config only" true, and tests/test_extensibility.py
# proves it by adding PASSPORT_NUMBER with zero package-code changes.
#
# Field semantics
#   category                 PII | PHI | LEGAL | FIN
#   presidio                 remap a Presidio built-in recognizer
#   patterns                 build a PatternRecognizer from these regexes
#   gazetteer                build a phrase-list recognizer from detection/data/<file>
#   context                  words near a match that boost its score (Presidio's
#                            context enhancer) and, for a `presidio:`-backed entity,
#                            decide which registry entity claims a shared built-in
#                            hit (see DOB vs DATE)
#   only_in_doc_categories   restrict this entity to documents tagged with one of these
#   threshold                per-entity override of SCP_THRESHOLD_OBFUSCATE
#   strategy                 per-entity override of the configured strategy
#   tier                     pseudonymization tier (section 9.3); default 1
#   hint                     emit class-annotated tokens from the gazetteer class column
#   action                   strip  -> remove the span entirely, no vault entry
#                            redact -> force [REDACTED_<TYPE>] regardless of confidence
#
# A property of `context` that is not obvious from the build doc and cost real recall:
# Presidio's LemmaContextAwareEnhancer compares each configured context word against
# the five tokens preceding the match, and the test is `configured_word in word` --
# a substring test, in that direction. So an inflected context word can never fire:
# the lemma of "filed" is "file", and "filed" is not a substring of "file". The build
# doc's registry ships four such words -- CASE_ID "filed", DIAGNOSIS "presents",
# MEDICATION "prescribed"/"takes" -- all silently inert. Three are replaced here by
# the stem that does match; "takes" has no working spelling at all, for the second
# reason given below. Keeping the doc's spelling alongside was tried and rejected:
# a config value that provably cannot fire is dead weight a reader has to re-derive.
#
# A FIFTH doc word is replaced and is NOT of that kind. This note used to count
# ACCOUNT_NUMBER's "routing" among the inert four, and that was false in the phrasing
# that matters: spaCy lemmatises "routing" to "routing" in the noun-adjunct reading --
# measured on "Please wire to the bank routing number 021000021", i.e. the actual ACH
# context -- so the specification's own word does boost there, 0.70 -> 1.00. It is
# inert only in the verb reading ("they were routing the calls", lemma "rout"). The
# shipped "rout" is therefore a WIDENING rather than a repair, and what it costs is
# recorded above the ACCOUNT_NUMBER entry and in README Deviation 34.
#
# There is a second filter behind the first, and the stem rule alone does not survive
# it. The enhancer does not search the raw lemmas: `_extract_surrounding_words` keeps
# a preceding lemma only when it also appears in `nlp_artifacts.keywords`, which is
# the lemma list with spaCy's stop words removed. "take" is its own stem, passes the
# lemma rule, and is still unreachable -- spaCy classes it as a stop word, so it never
# reaches the substring test at all. The doc's "takes" therefore has no working
# spelling in this position and MEDICATION ships without it.
# `tests/test_detection.py::test_every_context_word_can_boost_a_real_match` asserts
# against the keyword list rather than the lemma list, so it fails on either mistake.
#
# NOTE (deviation from build doc section 6.2): CASE_ID's patterns are written with
# single backslashes here. The doc shows `\\b`, which inside YAML single quotes is a
# literal backslash followed by "b" -- not a word boundary. Every other entry in the
# doc uses single backslashes; CASE_ID is normalised to match.

categories: [PII, PHI, LEGAL, FIN]

entities:

  # --- Presidio built-ins, remapped ---------------------------------------
  NAME:
    category: PII
    presidio: PERSON
    tier: 1

  SSN:
    category: PII
    presidio: US_SSN
    tier: 1

  EMAIL:
    category: PII
    presidio: EMAIL_ADDRESS
    # Presidio's EmailRecognizer validates every candidate through
    # `tldextract`, which resolves the domain against the Public Suffix List.
    # An address whose suffix is not on that list scores zero and is dropped
    # silently -- which is every internal corporate domain a real enterprise
    # document carries (@acme.internal, @hospital.local, @mail.corp) and every
    # gTLD newer than the PSL snapshot bundled with the installed tldextract.
    # Measured: 5/5 internal-domain addresses missed, 0.0 recall, no warning.
    # This backstop pattern asks only for an @ and a dotted domain, so it does
    # not depend on a registry of suffixes that can go stale. Presidio still
    # supplies the higher score (1.0 vs 0.7) on PSL-resolvable addresses; the
    # two hits cover the same span and collapse in overlap resolution.
    #
    # The leading anchor is a negative lookbehind on the local-part class, not the
    # '\b' this pattern was first written with. '\b' fires between every letter and
    # every dot, so on a long dotted run the scan restarts at each of ~n/2 positions
    # and walks to the end from each: quadratic, a clean 4x per doubling, measured
    # at 65 / 258 / 1035 ms on 4,000 / 8,000 / 16,000 characters.
    #
    # The run must END IN AN "@" to reproduce it, and this comment previously said
    # the opposite -- "a long dotted run that never reaches an '@'" -- which is the
    # input the regression test still used and the reason it certified a fix it
    # never exercised. `regex` prefilters on the required literal, so with no '@' in
    # the subject the scan never starts at all: the pre-fix pattern returns in
    # 0.006 ms on 16,000 characters, and reverting the lookbehind left all 37 ReDoS
    # attacks green. See `email-dotted-local-at` in tests/test_detection.py.
    #
    # The lookbehind admits only positions not already inside a local part, which
    # leaves one start per run -- 1.02 ms on the 16,000-character '@'-terminated
    # input, against 1035 ms, and 2.00x per doubling. Matches are
    # unchanged on every fixture and near-miss in the suite; where the two forms can
    # differ at all the lookbehind starts one character earlier, which widens the
    # masked span rather than narrowing it.
    patterns: ['(?<![A-Za-z0-9._%+\-])[A-Za-z0-9._%+\-]+@[A-Za-z0-9\-]+(?:\.[A-Za-z0-9\-]+)+']
    # "mail" rather than "e-mail": spaCy splits the hyphenated form into
    # ['e', '-', 'mail'], and "mail" is what matches the lemma that survives.
    context: [email, mail, contact, reply]
    tier: 1

  PHONE:
    category: PII
    presidio: PHONE_NUMBER
    tier: 1

  ADDRESS:
    category: PII
    presidio: LOCATION
    # Verbatim from the build doc and, on this registry, decorative. A `presidio:`-only
    # entity's context never reaches a recognizer -- build_recognizers only builds for
    # `patterns:`/`gazetteer:` -- so its sole consumer is _resolve_builtin's tie-break
    # between the registry entities claiming one built-in. LOCATION has exactly one
    # claimant and ADDRESS is not `requires_context`, so the tie-break has nothing to
    # decide and these four words change no detection: measured, dropping the whole
    # list leaves every span in the corpus bit-identical. Kept rather than deleted
    # because it is spec-mandated and becomes live the moment a second LOCATION
    # claimant is added; test_context_lists_have_a_live_consumer holds the exemption
    # and fails when that happens, so the note cannot quietly go stale.
    context: [address, street, residence, lives]
    tier: 1

  DOB:
    category: PII
    presidio: DATE_TIME
    # "d.o.b" is here because the context test is a word-boundary match on each
    # listed word: "\bdob\b" does not match "D.O.B." (the dots are word boundaries),
    # so "Patient D.O.B. 03/12/1985" lost its birth context and fell through to
    # DATE -- which only exists in medical documents, so outside one the date was
    # dropped entirely. "\bd\.o\.b\b" matches the punctuated spelling.
    context: [dob, born, birth, birthdate, d.o.b]
    # Without a birth-context word nearby a bare date is NOT a DOB. In a medical
    # doc the DATE entry picks it up (HIPAA treats individual-related dates as
    # identifiers); elsewhere it passes through. See section 9.2 "DOB vs DATE".
    requires_context: true
    require_digit: true
    tier: 2

  DATE:
    category: PHI
    presidio: DATE_TIME
    # Build doc section 6.2, verbatim, and section 331 states the consequence: "in
    # `medical` docs, remaining dates map to DATE (PHI -- HIPAA treats
    # individual-related dates as identifiers); elsewhere bare dates pass through."
    #
    # THAT PASS-THROUGH IS A REAL DISCLOSURE AND THIS COMMENT USED TO BE THE ONLY
    # PLACE IT WAS RECORDED, which is a place no reviewer reads. Measured at the
    # provider boundary on the shipped fixtures, both strategies, it is 153 distinct
    # dates in cleartext from legal_brief_large.txt, 11 from financial_disclosure.txt
    # (the whole PART IV ledger plus the reporting period), 4 from legal_memo.txt and
    # 0 from medical_note.txt. It is now declared in the README's section 1 boundary
    # list -- "A sixth limit" -- and pinned by
    # tests/test_declared_boundaries.py::test_ordinary_dates_pass_through_outside_medical_documents
    # so widening this entry turns that table red instead of leaving it silently
    # stale. Widening it is a product decision, not a bug fix.
    only_in_doc_categories: [medical]
    # Presidio's DATE_TIME also fires on relative prose ("daily", "overnight",
    # "the last twelve hours"). Those are not identifiers, and vaulting them poisons
    # the egress gate: a common English word in the originals set blocks every
    # payload that contains it. A date that identifies someone carries a numeral.
    require_digit: true
    tier: 2

  # --- custom pattern recognizers -----------------------------------------
  # IDENTIFIER-POSITION RULE. Read this note once; MRN, ACCOUNT_NUMBER and CASE_ID
  # below are all three instances of it.
  #
  # A numeric identifier is not recognisable from its digits. A bare run of digits is
  # equally an order count, a page reference, a sample size or a quantity, which is
  # why "a bare-digit rule" is not an option: it fires on every one of those. What
  # makes a digit run an identifier is its POSITION -- it is introduced by a noun
  # phrase naming the thing being identified -- and across registers that noun phrase
  # has one regular shape:
  #
  #     <artefact/subject noun> <sep> <digits>
  #     <artefact/subject noun> <sep> <generic identifier word> <sep|copula> <digits>
  #
  #     artefact/subject noun   register vocabulary: record, chart, mrn, patient,
  #                             subject, file / account, acct, a/c
  #     generic identifier word register-independent: no., number, num, id, ident,
  #                             ref, #
  #     copula                  the link an English sentence uses in place of a colon
  #
  # The copula is admitted ONLY in the second form. "chart number is 4419307" has
  # already said that a number is being named, so the "is" is a separator. "Records
  # show 8814027 encounters" has not, and treating a verb as a separator there claims
  # a quantity as an identifier -- measured on the dev corpus, that is exactly what
  # the loose form did.
  #
  # THE SPAN IS THE IDENTIFIER, NOT THE LABEL. The label is matched inside a '\K',
  # which drops everything before it from the reported span. This is a security
  # property, not cosmetics. The engine vaults `detection.text`, and the egress gate's
  # first pass scans the outbound payload for *vaulted originals*; if the vaulted
  # original is "Account No. 100200300400" then the bare "100200300400" -- which is
  # the entire secret, the label being boilerplate -- is not in the needle set, and a
  # second mention of it ("ledger row 100200300400") went to the provider verbatim.
  # Measured: it did. With '\K' the vaulted original IS the bare identifier, so pass 1
  # protects every occurrence of it in the document, labelled or not.
  #
  # '\K' is a `regex`-module construct. That is the module Presidio's PatternRecognizer
  # imports and therefore the engine these patterns actually run under; the registry
  # loader validates `patterns:` with the same module for that reason.
  #
  # Separator runs are POSSESSIVE ('*+'), not plain '*'. Two plain unbounded
  # whitespace quantifiers either side of an optional group can split one run of
  # blanks between them n ways -- the quadratic backtracking the ACCOUNT_NUMBER note
  # below records measuring at 4x per doubling. A possessive quantifier never gives
  # characters back, so the split is unique and the scan is linear; measured on the
  # ReDoS harness both patterns hold a flat 2.0x per doubling on every blank- and
  # separator-run attack. Bounding the runs instead ({0,6}) also works and was tried
  # first -- it silently broke every column-aligned chart header, where "MRN" and its
  # value are twenty spaces apart. A real document shape must not cost recall to buy
  # linearity when an unbounded possessive run buys both.
  #
  # Replaces the build doc's '\bMRN[:#\s]*\d{6,10}\b'. That form is case-sensitive,
  # accepts only colon/hash/whitespace, and knows three literal labels, so it misses
  # "MRN-4471902", "mrn 4471902", "Medical Record Number: 4471902", and every spelling
  # that names the field some other way -- "Rec # 552140", "Patient number 4471902",
  # "chart ref 4902118". A miss here is an unobfuscated identifier, the one failure
  # the system cannot recover from: the egress gate's first pass scans for *vaulted*
  # originals and its second re-runs this same detector, so a value no pattern anchors
  # on is invisible to both.
  #
  # What is still not covered: a chart number in an unlabelled table or CSV column,
  # where no noun introduces it at all. Nothing short of a bare-digit rule reaches
  # that, and a bare-digit rule is the trade this whole note exists to refuse.
  MRN:
    category: PHI
    patterns:
      - '(?i)\b(?:mrn|mr|medical\s+record|record|rec|chart|patient|subject|file)s?\.?[\s:#.\-/]*+(?:(?:number|num|no|ident|id|ref|#)\.?[\s:#.\-/]*+(?:(?:is|was)[\s:#.\-/]*+)?)?\K\d{6,10}\b'
    context: [medical, record, chart]
    tier: 1

  # {2,6} on the letter prefix, against the build doc's {2,4}. The doc's bound knows
  # BCBS and UHC and misses every payer whose member-ID scheme prints five or six
  # letters -- AETNA, CIGNA, HUMANA, ANTHEM. That is the identifier-position rule's
  # failure class stated verbatim above MRN: a member ID no pattern anchors on is
  # never vaulted, so the egress gate's first pass has no needle for it and its
  # second re-runs this same pattern. Measured before the change, on the literal
  # sentence "Member ID AETNA1234567 and policy HUMANA12345678 and BCBS123456789 on
  # file.": one detection, the four-letter prefix, and both longer member IDs went to
  # the provider byte for byte. After: three.
  #
  # The precision cost was measured, not argued, because a prefix bound is exactly
  # the kind of widening this file refuses elsewhere. Two more letters do not touch
  # what makes the pattern specific -- the letters stay UPPER case and must abut the
  # digit run with no space or separator, so "AETNA 4412093" and "Aetna4412093" are
  # still not matches, and an all-caps token welded to seven-plus digits is an
  # identifier in every register the corpora carry. Held-out INSURANCE_ID coverage
  # 4/5 -> 5/5 ('AETNA4412093' was the one shortfall); false positives on both clean
  # corpora unchanged at 0 of 35 documents; unannotated spans inside the recall
  # corpus unchanged at 4 against a cap of 6. {2,7} buys no payer either corpus
  # knows and was not taken.
  INSURANCE_ID:
    category: PHI
    patterns: ['\b[A-Z]{2,6}\d{7,12}\b']
    context: [insurance, member, policy, payer]
    tier: 1

  DIAGNOSIS:
    category: PHI
    gazetteer: diagnoses.txt
    tier: 3
    hint: true
    # "present" replaces the build doc's "presents" -- see the header note; the
    # stem is what matches, and it covers "presents" and "presenting" too.
    context: [diagnosis, dx, condition, present]

  MEDICATION:
    category: PHI
    gazetteer: medications.txt
    tier: 3
    hint: true
    # "prescribe" replaces the doc's "prescribed"; the doc's "takes" is dropped
    # outright because neither it nor its stem can reach the enhancer (header note).
    context: [mg, dose, prescribe, medication]

  # Five changes to the build doc's pattern, all measured on the recall corpus in
  # tests/test_detection.py:
  #   (?i)  -- a chart writes "Creatinine" at the head of a table row and "a1c" in
  #            running prose. The analyte names carry the specificity; case does not.
  #   lazy  -- greedy, "your LDL is 162 and your A1C came back at 7.4" matched
  #            the single span "LDL is 162 and your A1" (the "1" of "A1C" satisfying
  #            \d+) and swallowed the start of the second analyte, so the 7.4 escaped.
  #            Lazy stops at the first number after each analyte, giving two spans.
  #   NEWLINE_TAIL -- see the note above CASE_STRATEGY at the foot of this file; a
  #            value in the next column of a wrapped table row is one newline away
  #            from its analyte.
  #   LABEL_GUARD -- the newline branch above, unguarded, ran off the end of the row
  #            and into the NEXT FIELD'S LABEL. "Recent labs: LDL\nDOB: 1974-03-02"
  #            matched the single span "LDL\nDOB: 1974", and that is all three of the
  #            harms the NER line-break trim in detector.py enumerates, occurring on a
  #            pattern that trim deliberately exempts: the splice collapses two lines
  #            and destroys the DOB label; the vaulted original is a composite that is
  #            not a value, so the bare date is never an original and the egress gate
  #            has no needle for it; and a PII date is typed and audited as PHI.
  #            The exemption's stated ground -- that a pattern-backed sentence tail is
  #            *required* to span a hard wrap -- is true of CASE_STRATEGY and
  #            SETTLEMENT_TERM, which need the wrap to reach the end of a sentence. It
  #            is not true here: LAB_RESULT is a field-VALUE pattern and needs the
  #            wrap only to reach the value in the next column of one wrapped row, so
  #            it has no reason ever to cross a "<label>:" boundary. The guard refuses
  #            exactly that shape -- a newline followed by a short letters-only run
  #            and a colon -- and nothing else, so "HbA1c\n    7.4", the layout the
  #            branch exists for, still matches. Measured: two composite spans on the
  #            finding's own inputs before, zero after, with the bare DOB now detected
  #            as DOB in both.
  #   period branch -- '[^.\n]' cannot cross any '.', so two ordinary extracted-chart
  #            layouts returned ZERO detections: a parenthetical abbreviation, "LDL
  #            cholesterol (calc.) 162", and the dot leaders of a fixed-width table,
  #            "WBC ..... 12.3". Undetected is un-vaulted, which is invisible to all
  #            three egress passes. The branch is written as the two SHAPES those
  #            layouts are made of, not as a blanket "a '.' is crossable unless a
  #            letter follows". The blanket form was tried first and is what a
  #            sentence boundary looks like from the inside: it made ". " crossable
  #            whenever the next sentence opened on anything but a letter, so
  #            "Her LDL was normal. 3 refills were sent" vaulted
  #            "LDL was normal. 3", "eGFR unremarkable. 62-year-old male" vaulted
  #            "eGFR unremarkable. 62", and three more like them -- text that is not
  #            a lab value, vaulted as one, which makes the restored answer wrong in
  #            a way the reader cannot see. The two shapes instead are:
  #              '\.(?=[.)\]}])'          -- a '.' abutting a closer or another '.':
  #                                          the "(calc.)" abbreviation, and every
  #                                          dot of a leader run but the last.
  #              '(?<=\.)\.(?![.)\]}])'   -- the LAST dot of a leader run, which is
  #                                          identified by the dot BEFORE it.
  #            A sentence-ending '.' has neither shape -- nothing abuts it on the
  #            right and its left neighbour is a letter -- so it is uncrossable
  #            whatever follows the space. The residual, stated rather than hidden:
  #            a parenthetical that ends in a full stop ("(see below.) 42") has the
  #            first shape and is crossable, because it is byte-identical to
  #            "(calc.) 162". It is bounded by the {0,30} tail.
  #            The two guards are mutually exclusive on the character after the dot,
  #            so exactly one of them can consume any given '.'. That is a
  #            performance property, not tidiness: the first draft used
  #            '\.(?=[.)\]}])|(?<=\.)\.' -- no '(?!...)' on the second -- which lets
  #            both branches consume the same dot. Measured on `regex` with
  #            PATTERN_FLAGS, i.e. the engine the detector actually runs, a mere
  #            "A1C " + "." * 250 went from 0.03 ms to 57 SECONDS of backtracking:
  #            a denial of service reachable from one uploaded fixed-width table,
  #            and one the shipped ReDoS harness could not see, because its
  #            LAB_RESULT rows (`a1c-filler`, `a1c-newlines`) carry no dot run. The
  #            guard is held by test_registry_edges.py's LAB_DOT_RUN_ATTACKS, which
  #            is that missing row. With the guard, and with the four
  #            branches disjoint on their first character so the alternation stays
  #            deterministic, the same dot-run attacks the existing `a1c-*` ReDoS
  #            rows do not carry ("A1C " + "." * n, ". " * n, ".\n" * n) measure
  #            0.03 / 0.06 / 0.11 / 0.23 ms at 4k / 8k / 16k / 32k characters -- a
  #            flat 2.0x per doubling, and equal to the pattern this replaces to
  #            two decimal places.
  #   {0,30} rather than the doc's {0,20} -- " cholesterol (calc.) " is 21 characters,
  #            so the parenthetical layout needs 21 of the 20 the doc allows and the
  #            period branch alone does not reach it. 30 is that measurement plus one
  #            short word. It is not a licence to run: every branch consumes exactly
  #            one character, so 30 is 30 characters and not 30 runs, the tail is
  #            lazy and stops at the first digit after the analyte, and no branch can
  #            cross a sentence boundary at any width. Measured span-for-span over
  #            117 documents -- the four shipped fixtures plus RECALL_CORPUS,
  #            CLEAN_CORPUS and HELD_OUT_CORPUS in tests/test_detection.py -- {0,30}
  #            and the doc's {0,20} give byte-identical matches once the period
  #            branch is written as the two shapes above: 0 documents differ. The
  #            extra ten characters are spent only on "(calc.)".
  LAB_RESULT:
    category: PHI
    patterns: ['(?i)\b(?:A1C|HbA1c|LDL|HDL|WBC|eGFR|creatinine)\b(?:[^.\n]|\.(?=[.)\]}])|(?<=\.)\.(?![.)\]}])|\n(?![ \t\r]*\n)(?![ \t]*[A-Za-z][A-Za-z .]{0,20}:)){0,30}?\d+(?:\.\d+)?']
    context: [lab, result]
    tier: 4

  # The financial instance of the identifier-position rule above. Replaces the build
  # doc's '\b(?:acct|account)[:#\s]*\d{8,17}\b', which is case-sensitive and allows no
  # label between the word and the digits, so it misses "Account: ...", "Account No.
  # ...", "Account Number: ..." and "Acct. ..." -- the four ways a statement or wire
  # instruction actually writes it. The 8-17 digit run is what makes the match
  # specific; the noun phrase is only the anchor, and '\K' keeps it out of the span.
  #
  # THE DIGIT RUN IS GROUPED AS OFTEN AS IT IS CONTIGUOUS, and the second branch is
  # there for that. An unbroken run misses EVERY card-style spelling: measured on an
  # 18-case matrix, "Account Number: 482910573364" and "Acct #48291057" detect and
  # "Bank Account Number: 4829-1057-3364" and "... 4829 1057 3364" return NOTHING.
  # The held-out corpus already carried one, '4400 8829 1374', and HELD_OUT_MISS_SHAPES
  # in tests/test_detection.py called it "a real gap" rather than a known limit. A
  # missed account number is never vaulted, so the egress gate's first pass has no
  # needle for it and its second re-runs this same pattern: it reaches the provider
  # byte for byte, which is the one failure this pipeline cannot recover from.
  #
  # THE ANCHOR IS UNTOUCHED. Only the shape BEHIND 'account|acct|a/c' moved; the noun
  # phrase is what keeps the false-positive surface small and widening it was refused.
  # Two consequences are left in place deliberately: "Card 4829105733642201" (16
  # contiguous digits, no account noun) and "IBAN: GB29 NWBK 6016 1331 9268 19" (no
  # account noun AND an alphanumeric value) are both still missed. Reaching them needs
  # a new anchor word or a letter-bearing value shape, which is a widening of the
  # anchor rather than of the digits.
  #
  # THE GROUP COUNT IS {2,3}, NOT {1,3}, and that bound was bought with a measurement.
  # Allowing two groups admits eight digits split 4+4, and the shortest thing of that
  # shape in ordinary financial prose is a pair of adjacent years: "the account 2023
  # 2024 comparison shows growth" matched '2023 2024' under {1,3}. Three groups is
  # twelve digits, and three adjacent four-digit runs immediately behind an account
  # noun is not a year pair. Measured over 160 documents -- the four shipped fixtures,
  # 120 generated ones and every corpus embedded in tests/ -- the widened pattern adds
  # SIX new spans, all of them true account numbers a reviewer planted by hand
  # ('7781-2245-9930', '1002-0030-0400', '9004-4392-9552'), and loses none.
  ACCOUNT_NUMBER:
    category: FIN
    # Possessive separator runs, for the reason the shared note gives: this pattern is
    # where the quadratic split was measured (0.28/1.1/4.4 ms at 200/400/800 spaces
    # after "account", a clean 4x per doubling) when both runs were plain '*'.
    #
    # The group separator is a single ' ' or '-' rather than a run, and the repeat is
    # bounded, so the second branch adds no unbounded quantifier to a pattern this
    # file has already paid to make linear.
    patterns: ['(?i)\b(?:acct|account|a/c)s?\.?[\s:#.\-]*+(?:(?:number|num|no|ident|id|ref|#)\.?[\s:#.\-]*+(?:(?:is|was)[\s:#.\-]*+)?)?\K(?:\d{8,17}|\d{4}(?:[ -]\d{4}){2,3})\b']
    # "rout" is not a typo, and it is not the doc's "routing" repaired either. The
    # noun-adjunct lemma of "routing" is "routing", so the doc's own word already
    # boosts in the ACH reading; "rout" is the lemma only of the verb. "rout" is a
    # substring of both, so it covers both readings -- and the honest cost is that it
    # is a substring of "routine", "route" and "router" too, which the doc's word is
    # not. Kept because a missed ACH context is a missed obfuscation and a spurious
    # context boost is not. Header note, and README Deviation 34.
    context: [account, bank, rout]
    tier: 1

  TAX_ID:
    category: FIN
    patterns: ['\b\d{2}-\d{7}\b']
    context: [ein, tax, taxpayer]
    tier: 1

  AMOUNT:
    category: FIN
    # Unbounded over digits and commas, ending on a digit, rather than the build
    # doc's `[\d,]{1,12}`. The reason is a partial disclosure rather than tidiness:
    # a character-class BOUND counts digits and commas together and truncates at the
    # twelfth, so `$1,234,567,890.12` matched only `$1,234,567,` -- the token was
    # spliced in beside a bare `890.12`, six digits of a real figure in the clear,
    # with no pass-1 needle for them because the vaulted original is the truncated
    # string. Same class as the partial-value shape Deviation 48 exists to close.
    #
    # A strictly 3-digit-grouped alternation (`\d{1,3}(?:,\d{3})+|\d+`) was tried
    # first and is WORSE than the build doc's version, not better: it truncates every
    # amount that is not grouped in threes. `$12,34,567` -- Indian numbering, and
    # any typo -- matched `$12` and left `,34,567` on the wire, where the original
    # pattern matched the whole thing. Assuming a grouping convention re-created the
    # defect it was written to remove, one shape to the left.
    #
    # Ending on a digit (`\d[\d,]*\d|\d`) keeps a trailing clause comma out of the
    # span. `{1,2}` on the cents (the doc says `{2}`) closes the same hole one
    # character wide: `$1,234.5` matched `$1,234` and left `.5`. Linear, no nesting:
    # 0.6 ms against 80,000 characters of `1,`.
    patterns: ['\$\s?(?:\d[\d,]*\d|\d)(?:\.\d{1,2})?']
    only_in_doc_categories: [financial]
    tier: 4
    context: [transaction, payment, deposit, withdrawal, balance]

  # --- legal ---------------------------------------------------------------
  CLIENT_IDENTITY:
    category: LEGAL
    presidio: PERSON
    only_in_doc_categories: [legal]
    tier: 1

  # The build doc's first pattern only fires behind a literal "Case No." and only
  # for a lowercase two-letter division code, so it misses the bare docket number
  # ("filed in 1:23-cv-04567"), which is how the number is written everywhere in a
  # brief after the caption, and it misses "1:23-CV-04567". Worse than a miss: the
  # uppercase form fell through to the second pattern, which matched only
  # "23-CV-04567" and left the district prefix "1:" in the clear. Pattern 1 below
  # matches the docket shape on its own, in either case, so it covers every labelled
  # THE SECOND PATTERN USED TO BE CASE-SENSITIVE, and the note here used to defend
  # that: "'\d{2}-[a-z]{1,4}-\d{3,6}' would match ordinary hyphenated prose". The
  # defence named no shape, and the cost was not a trade but a split brain -- pattern
  # 1 carried '(?i)' and its sibling did not, in the same entity, so "Docket
  # 24-CV-88213" detected and "Docket 24-cv-88213" returned NOTHING. Lowercase is how
  # a docket number is written in running prose, so the case the pattern refused was
  # the common one.
  #
  # The shape the old note was reaching for is REAL, and it is exactly one shape: a
  # day-month-year date. '21-Aug-1958' is a birth date in the held-out corpus and
  # '17-Feb-1995' is a DOB row in SPELLING_VARIANTS, and a blanket '(?i)' claims both
  # as case numbers -- masked, but audited LEGAL rather than PII and tiered as an
  # identifier rather than a date. So the guard is a negative lookahead naming the
  # twelve months instead of a case rule that fails on two thirds of real dockets.
  # A closed list is the right instrument here for the reason it is the wrong one
  # above MRN: months are twelve forever, where label spellings and payer codes are
  # open sets that go stale. The '[a-z]?' tail covers 'sept', 'june' and 'july';
  # anything longer ('March', 'April') cannot reach the pattern's second '-' at all.
  #
  # THE LEADING RUN IS \d{2,4} AND THERE IS A THIRD PATTERN, both for four-digit
  # years. Measured on an 18-case matrix, "1:24-cv-08821" and "24-CV-88213" detect
  # while "2024-CV-88213" -- the spelling a plainly formatted "Legal Case Number:
  # Case No. 2024-CV-88213" uses -- and the state-court ordering "CV-2024-008821"
  # return nothing. Pattern 3 is the same three-part shape as pattern 2 with the year
  # and the division code swapped, so it adds no false-positive CLASS that pattern 2
  # did not already have: both claim a hyphenated reference code of that shape, which
  # is the property the leakage harness's UNKNOWN_SHAPE_VALUE is chosen to avoid.
  #
  # Measured over 160 documents -- the four shipped fixtures, 120 generated ones and
  # every corpus embedded in tests/ -- all three changes together add ONE span and
  # lose none: 'Accession 2024-CT-88140' in the held-out radiology report, a
  # radiology accession number that is indistinguishable from a four-digit-year
  # docket by shape alone. It is unannotated, so no floor moves; the honest cost is
  # that a PHI identifier is now masked under a LEGAL type. That is the mis-tier the
  # HELD_OUT_INCIDENTAL_MASKS table exists to grade as the lesser failure, and it is
  # bought with three shapes that were reaching the provider in the clear.
  #
  # The doc's labelled pattern is GONE rather than rewritten. It was kept here for a
  # while because its longer span won overlap resolution and took the label with it,
  # and that turned out to be the defect, not the feature: the engine vaults
  # `detection.text`, so the vaulted original became "Case No. 1:23-cv-04567" and the
  # bare docket number in the next paragraph -- the identifier itself -- was a
  # different string. Measured, the same docket got two different surrogates in one
  # document. Once the label is excluded from the span (see the identifier-position
  # note above MRN) the labelled pattern's match is character-for-character the bare
  # pattern's, on every spelling in the suite, so it is dead config: a pattern nothing
  # can distinguish from its own absence.
  CASE_ID:
    category: LEGAL
    patterns:
      - '(?i)\b\d{1,2}:\d{2}-[a-z]{2,4}-\d{3,6}\b'
      - '(?i)\b\d{2,4}-(?!(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]?-)[a-z]{1,4}-\d{3,6}\b'
      - '(?i)\b[a-z]{2,4}-\d{4}-\d{3,6}\b'
    # "file" replaces the doc's "filed" (header note); it matches the lemma of
    # "filed", "filing" and "files" alike.
    context: [case, docket, matter, court, file]
    tier: 1

  # Case-folded and newline-tolerant (NEWLINE_TAIL, below) against the build doc's
  # form. "Settlement demand of $1,250,000" opens a sentence, so the capital S is the
  # common spelling and the doc's case-sensitive '\bsettle' misses it outright.
  SETTLEMENT_TERM:
    category: LEGAL
    patterns:
      - '(?i)\bsettle(?:ment)?(?:[^.\n]|\n(?![ \t\r]*\n)){0,60}\$\s?[\d,]+(?:\.\d+)?'
      - '(?i)\$\s?[\d,]+(?:\.\d+)?(?:[^.\n]|\n(?![ \t\r]*\n)){0,40}settlement'
    context: [settlement, demand, offer]
    tier: 4

  # 'attorney\s+work\s+product' is added ahead of the bare 'work\s+product' because
  # alternation is leftmost-first: on "ATTORNEY WORK PRODUCT" the doc's form matched
  # only the trailing two words and left the word "Attorney" behind, which is a
  # privilege assertion the strip exists to remove.
  PRIVILEGED_MARKER:
    category: LEGAL
    patterns:
      - '(?i)\b(privileged\s+(?:and|&)\s+confidential|attorney[\s-]client|attorney\s+work\s+product|work\s+product)\b'
    action: strip

  # NEWLINE_TAIL. The build doc writes the sentence tail as '[^.\n]{0,120}', which
  # ends the span at the first newline. Every document that reaches this pipeline has
  # been through the text extractor, and PDF, DOCX and TXT all arrive hard-wrapped at
  # 70-80 columns -- so on a real document the tail stops mid-sentence and the rest of
  # the strategy sentence goes to the provider in the clear. That is the one thing
  # `action: redact` exists to prevent, and it is not a corner case: it happens to
  # every strategy sentence longer than one output line.
  #
  # '(?:[^.\n]|\n(?![ \t\r]*\n)){0,240}' consumes a newline only when it is a soft
  # wrap -- a blank line still ends the span, so the redaction cannot run away into
  # the next paragraph. The two branches are disjoint on their first character, so
  # the alternation is deterministic and the bound keeps it linear (the ReDoS test
  # covers it).
  #
  # The bound itself is 240 rather than the doc's 120: two lines of wrapped text is
  # an ordinary length for a sentence stating a legal position, and the corpus had
  # one that 120 truncated. Over-running is the safe direction for a `redact`
  # entity, and CHUNK_OVERLAP_CHARS is sized to stay ahead of whatever this is.
  CASE_STRATEGY:
    category: LEGAL
    patterns:
      - '(?i)\b(?:our|the)\s+(?:litigation|settlement|trial|defense|defence|negotiation)\s+(?:strategy|approach|posture|position)\b(?:[^.\n]|\n(?![ \t\r]*\n)){0,240}'
      - '(?i)\bwe\s+(?:should|recommend|intend|plan|propose|are\s+prepared|are\s+inclined)\s+to\b(?:[^.\n]|\n(?![ \t\r]*\n)){0,240}'
    only_in_doc_categories: [legal]
    action: redact
